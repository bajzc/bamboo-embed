# guji-rag configuration. Code reads models/paths ONLY from here (+ env vars).
# Dev uses cloud (qwen-max) for the LLM parts (HyDE, later generation); switch to
# `local` for a fully offline run once llama-server is running (see README).
profile: local            # local | cloud

providers:
  cloud:
    llm:
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model: qwen-max
      api_key_env: DASHSCOPE_API_KEY
  local:
    llm:
      base_url: http://localhost:8080/v1    # llama-server, Vulkan backend (OpenAI-compatible)
      model: qwen3.6-35b-a3b                # informational only — llama-server ignores this
      # base_url: http://localhost:11434/v1     # Ollama (OpenAI-compatible)
      # model: qwen3:8b                         # small enough for M3 16GB
      api_key_env: null
      # Optional: let guji spawn/stop this llama-server itself instead of you keeping
      # it resident by hand (avoids OOM on 16G machines when LLM+reranker+embedding
      # would otherwise all be loaded at once — see README "内存占用" section).
      # Only starts it if base_url isn't already answering; only stops what it started.
      launch:
        command: [llama-server, --host, 127.0.0.1, --port, "8080",
                  --model, models/Qwen3-8B-IQ4_NL.gguf,
                  --jinja, --ctx-size, "32768", --n-gpu-layers, "99",
                  --flash-attn, auto, --cache-type-k, q4_0, --cache-type-v, q4_0,
                  --cont-batching, --reasoning, "off"]
        ready_timeout: 300

# ⚠️ embedding never participates in profile switching — always local.
# Backend is Ollama (cross-platform: identical vectors on Linux dev + macOS deploy),
# replacing the spec's MLX backend. Never build the index with cloud text-embedding-v4.
embedding:
  backend: ollama
  base_url: http://localhost:11434
  model: qwen3-embedding:0.6b
  dim: 1024
  # instruction prepended to QUERIES only (not documents) — Qwen3-Embedding supports it
  query_instruct: "給定一個關於中國古代典籍的問題，檢索相關的文言原文段落"
  # Same opt-in spawn-on-demand as providers.local.llm.launch — starts `ollama serve`
  # if it isn't already up. Not exclusive with the LLM/reranker (see procman.py): the
  # daemon is lightweight and manages its own model memory, so it's just started once
  # and left running for the command, no reload cost from interleaving with either.
  # health_path is "/" (Ollama's root, not "/health" — it has no such endpoint).
  launch:
    command: [ollama, serve]
    health_path: "/"
    ready_timeout: 60
# Rerank is a separate cross-encoder call. DashScope's endpoint is NOT OpenAI-compatible,
# so it has its own adapter (§2.1). `none` = skip rerank (RRF order kept). `local` talks
# to its own `llama-server --reranking` process (`guji models fetch reranker` to get the
# GGUF; see README) — separate port from the LLM's llama-server, no DashScope key needed.
rerank:
  backend: local                # dashscope | local | none
  # model: qwen3-rerank
  # base_url: https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank
  # api_key_env: DASHSCOPE_API_KEY
  # local (llama-server --reranking --pooling rank --embedding, its own port):
  model: qwen3-reranker-0.6b
  base_url: http://localhost:8081
  threshold: 0.35                   # top rerank score below this -> 未檢索到相關記載
  # Same opt-in spawn-on-demand as providers.local.llm.launch above, its own port.
  launch:
    # -b/-ub above the default 512: a query+passage pair over 512 tokens (common —
    # passages run 250–400 chars, +query, +chat-template overhead) otherwise 500s
    # with "input (N tokens) is too large to process" (llama-server, not a guji bug).
    # A single /v1/rerank call sends up to `retrieve.fuse_k` (50) documents in one
    # request, and -b/-ub caps the *combined* token count across that whole batch, not
    # per document — 4096 wasn't enough headroom and 500'd on a real eval question
    # (observed: 5607 tokens). 8192 was tried and made things worse: it hit a genuine
    # Metal-backend "Compute error" (ggml_metal_graph_compute backend-in-error-state)
    # partway through an eval run, which then poisons the backend for every request
    # after it until the process restarts — a hardware/driver batch-size ceiling on
    # this GPU, not a context-length problem. 6144 is the current compromise: enough
    # headroom over the observed 5607-token case without hitting that ceiling.
    command: [llama-server, --host, 127.0.0.1, --port, "8081",
              --model, models/Qwen3-Reranker-0.6B.Q8_0.gguf,
              --reranking, --pooling, rank, --embedding,
              --ctx-size, "6144", -b, "6144", -ub, "6144"]
    ready_timeout: 120

# HyDE: LLM writes a hypothetical 文言文 passage, which is embedded for the dense path
# to bridge the modern-query vs classical-document gap (§4.1). Toggle with --hyde/--no-hyde.
hyde:
  enabled: false
  max_tokens: 256

# Collapse near-duplicate hits from related books (史記 vs 史記三家注, §3.3).
dedup:
  enabled: true
  jaccard: 0.7

# Corpus source + on-disk artifact locations (all relative to repo root).
corpus:
  repo_url: https://github.com/JasonWade001/chtxt
  raw_dir: data/raw/chtxt

paths:
  data_dir: data
  manifest: data/manifest.json
  passages: data/passages.jsonl
  dict_db: data/dict.sqlite
  pua_map: data/pua_map.json
  char_report: data/char_report.json
  lancedb: data/lancedb            # vector store directory
  fts_db: data/fts.sqlite          # FTS5 sparse index
  eval_questions: eval/questions.jsonl
  eval_report_dir: eval/report

# Chunking parameters (§5.4).
chunk:
  narrative_min_chars: 250
  narrative_max_chars: 400
  overlap_paragraphs: 1

# Retrieval parameters (§4.1). RRF fusion — no linear weights to tune.
retrieve:
  dense_k: 50          # candidates from the vector path
  sparse_k: 50         # candidates from the FTS5 path
  rrf_k: 60            # RRF constant
  fuse_k: 50           # kept after fusion (fed to rerank in Phase 3)
  top_k: 8             # returned to the user / LLM

# Generation (§4.2). Three hard constraints enforced in code, not just prompted:
# structured citations must reference this turn's retrieved metadata, quotes (wrapped
# in quote_open/quote_close) must be verbatim, and the rerank threshold gate (above)
# skips generation entirely on a weak retrieval.
generate:
  max_tokens: 1024
  max_tool_rounds: 4
  retry_on_violation: 1
  quote_open: "『"
  quote_close: "』"
  validate_citations: true   # set false (or `ask --no-validate`) to skip the reject-and-retry gate
