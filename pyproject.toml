[project]
name = "guji-rag"
version = "0.1.0"
description = "中文古籍 RAG 检索系统 (offline Chinese-classics retrieval)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "opencc>=1.1",
    "pypinyin>=0.51",
    "lancedb>=0.13",
    "pylance>=0.13",
    "numpy>=1.26",
    "httpx>=0.27",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
guji = "guji.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guji"]

[tool.uv]
# install the project itself (editable) plus the dev extra into the synced venv
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
